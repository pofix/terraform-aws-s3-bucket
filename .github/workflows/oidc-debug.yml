# Temporary: calls oidc-debug-called.yml on a comment or label to print OIDC claims. Remove after the pilot.
name: oidc debug
on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [labeled]
permissions: {}
jobs:
  debug:
    if: >-
      (github.event_name == 'issue_comment' && github.event.comment.body == 'oidc-debug' && contains(fromJSON('["OWNER","MEMBER"]'), github.event.comment.author_association)) ||
      (github.event_name == 'pull_request_target' && github.event.label.name == 'oidc-debug')
    permissions:
      id-token: write
    uses: pofix/terraform-aws-s3-bucket/.github/workflows/oidc-debug-called.yml@23500cb639e977eb54788aa7cf9fd28aafc0a945
