# Pofix pull request review: the caller for one module repository.
#
# A template to copy, not a live workflow. Copy it into each module repository as
# .github/workflows/pofix-review.yml, then replace the placeholders:
#   pofix/terraform-aws-s3-bucket  owner/name of the repository holding pr-review.yml
#   baca8a371dafadc55eea217da75002dac6f12163        the 40-hex commit of that repository to run pr-review.yml from
#   pofix/pofix-skills   owner/name of the repository holding the pofix-agent skills
#   3c27e52cfbdb938891854e2ed5d85816c6c3787d          the 40-hex commit of the skills to run
# The repository also needs the secret and variables listed in ci/github/README.md,
# which explains how to pin and upgrade both SHAs.
#
# GitHub reads this file from the default branch for issue_comment events, so a pull
# request cannot change it. A comment containing "@pofix" on a pull request starts a run;
# the reusable workflow checks who wrote it before anything else happens.

name: pofix pull request review

on:
  issue_comment:
    types: [created]

permissions: {}

jobs:
  pofix:
    # The comment body is read only in this if: and in the reusable workflow's gate if:.
    if: >-
      github.event.issue.pull_request &&
      contains(github.event.comment.body, '@pofix') &&
      github.event.comment.user.type == 'User'
    permissions:
      contents: read
      pull-requests: read
      id-token: write
    uses: pofix/terraform-aws-s3-bucket/.github/workflows/pr-review.yml@baca8a371dafadc55eea217da75002dac6f12163
    with:
      skills_repository: pofix/pofix-skills
      skills_sha: 3c27e52cfbdb938891854e2ed5d85816c6c3787d
    secrets:
      POFIX_APP_PRIVATE_KEY: ${{ secrets.POFIX_APP_PRIVATE_KEY }}
